name: Vanta
options:
  bundleIdPrefix: com.vanta
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages: {}
targets:
  Vanta:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Vanta
        excludes:
          - "**/Secrets.swift"
    info:
      path: Vanta/App/Info.plist
      properties:
        CFBundleName: VANTA
        CFBundleDisplayName: VANTA
        UILaunchStoryboardName: null
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExpiringEmbeddedProfile: false
    settings:
      base:
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "100"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies: []
    scheme:
      testTargets:
        - VantaTests
  VantaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VantaTests
    dependencies:
      - target: Vanta
  VantaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - VantaUITests
    dependencies:
      - target: Vanta
schemes:
  Vanta:
    build:
      targets:
        Vanta: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VantaTests
        - VantaUITests
