name: SwitchEmu
options:
  bundleIdPrefix: com.vanta
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  SwitchEmu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - UI
      - Emulator
      - CPU
      - Memory
      - GPU
      - Metal
      - Audio
      - Input
      - Controller
      - Filesystem
      - SaveSystem
      - ShaderCache
      - Performance
      - Logging
    info:
      path: App/Info.plist
      properties:
        CFBundleName: SwitchEmu
        CFBundleDisplayName: SwitchEmu
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: null
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Resources/SwitchEmu.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.vanta.switchemu
    scheme:
      testTargets:
        - SwitchEmuTests
  SwitchEmuTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: SwitchEmu
schemes:
  SwitchEmu:
    build:
      targets:
        SwitchEmu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwitchEmuTests
