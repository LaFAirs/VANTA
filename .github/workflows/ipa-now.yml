name: IPA jetzt bauen

# Manueller IPA-Build ohne Version-Tag: Actions -> "IPA jetzt bauen" -> Run workflow.
# Baut auf dem macOS-Runner (Xcode) ein echtes, aber UNSIGNIERTES IPA
# (CODE_SIGNING_ALLOWED=NO, Payload/*.app per ditto gezippt) und laedt es
# als Artifact "VANTA-ipa-now" hoch. Kein Fake, keine Signatur-Behauptung:
# Unsignierte IPAs muessen vor der Installation mit der eigenen Apple-Identitaet
# re-signiert werden (siehe Documentation/RELEASING.md).
#
# Fuer signierte Releases weiterhin: git tag vX.Y.Z && git push origin vX.Y.Z
# (release.yml, braucht Apple-Secrets).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MARKETING_VERSION (x.y.z)"
        required: false
        default: "1.0.0"

permissions:
  contents: read
  actions: write

jobs:
  build-unsigned-ipa:
    name: Unsupported-signiertes IPA bauen (manuell)
    runs-on: macos-15
    env:
      APP_BUNDLE_ID: com.vanta.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version pruefen
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' ist nicht MAJOR.MINOR.PATCH (z. B. 1.0.0)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen || brew upgrade xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Vanta.xcodeproj || { echo "::error::xcodegen did not produce Vanta.xcodeproj"; exit 1; }

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive -scheme Vanta -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VANTA.xcarchive \
            "MARKETING_VERSION=${{ steps.version.outputs.version }}" \
            "CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}" \
            "PRODUCT_BUNDLE_IDENTIFIER=${{ env.APP_BUNDLE_ID }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" 2>&1 | tee build-archive.log
          test -d build/VANTA.xcarchive || { echo "::error::Archive was not created."; exit 1; }

      - name: Package unsigned IPA (Payload zip, no fake signing)
        run: |
          set -euo pipefail
          APPS=(build/VANTA.xcarchive/Products/Applications/*.app)
          [ ${#APPS[@]} -eq 1 ] || { echo "::error::Expected exactly one .app, found ${#APPS[@]}."; exit 1; }
          rm -rf build/Payload VANTA.ipa
          mkdir -p build/Payload
          cp -R "${APPS[0]}" build/Payload/
          ditto -c -k --keepParent build/Payload VANTA.ipa
          echo "Unsigned IPA packaged (NOT signed, NOT installable as-is)."

      - name: Validate IPA (gating)
        run: |
          set -euo pipefail
          bash Scripts/validate-ipa.sh VANTA.ipa \
            --mode unsigned \
            --expected-version "${{ steps.version.outputs.version }}"

      - name: Compute SHA256SUMS.txt from the real IPA
        run: |
          set -euo pipefail
          shasum -a 256 VANTA.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload IPA artifact (VANTA-ipa-now)
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-ipa-now
          path: |
            VANTA.ipa
            SHA256SUMS.txt
            build-archive.log
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## VANTA.ipa gebaut (unsigniert)

          - Artifact: **VANTA-ipa-now** (VANTA.ipa + SHA256SUMS.txt + build-archive.log)
          - Version: ${{ steps.version.outputs.version }} (Build ${{ steps.version.outputs.build }})
          - Modus: **unsigned** — vor der Installation mit eigener Apple-Identitaet re-signieren,
            Details siehe Documentation/RELEASING.md.
          - Pruefsumme lokal verifizieren: \`shasum -a 256 -c SHA256SUMS.txt\`
          EOF
