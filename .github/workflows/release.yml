name: Release

# Real IPA pipeline. Trigger: pushing a version tag (e.g. v1.0.0).
# Tag -> macOS runner -> XcodeGen -> tests -> archive -> IPA -> validate
# -> SHA256 -> GitHub Release with assets. No faked artifacts, ever.
#
# Signing modes (automatic, no code changes needed):
#   - Secrets ABSENT  -> "Unsigned / Build-only mode": real archive built with
#                        CODE_SIGNING_ALLOWED=NO, packaged as structurally valid
#                        but UNSIGNED IPA (must be re-signed before installing).
#   - Secrets PRESENT -> "Signed Release mode": real Apple signing via the
#                        maintainer's identity (see Documentation/RELEASING.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-ipa:
    name: Build, validate and publish VANTA.ipa
    runs-on: macos-15
    env:
      APP_BUNDLE_ID: com.vanta.app
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not MAJOR.MINOR.PATCH (expected e.g. v1.0.0)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building VANTA $VERSION (build ${GITHUB_RUN_NUMBER}) from tag $TAG"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen (+ SwiftLint, best effort)
        run: |
          set -euo pipefail
          brew install xcodegen || brew upgrade xcodegen
          brew install swiftlint || echo "::warning::SwiftLint unavailable; continuing without lint."

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Vanta.xcodeproj || { echo "::error::xcodegen did not produce Vanta.xcodeproj"; exit 1; }

      - name: Stamp release version into Info.plist (tag is source of truth)
        run: |
          set -euo pipefail
          PLIST="Vanta/App/Info.plist"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          set_or_add() {
            /usr/libexec/PlistBuddy -c "Set :$1 $3" "$4" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$4"
          }
          set_or_add CFBundleShortVersionString string "$VERSION" "$PLIST"
          set_or_add CFBundleVersion string "$BUILD" "$PLIST"
          set_or_add CFBundleIdentifier string "${{ env.APP_BUNDLE_ID }}" "$PLIST"
          echo "Stamped Info.plist:"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST"

      - name: Lint (advisory, never gates the release)
        run: swiftlint --strict || echo "::warning::SwiftLint reported issues (advisory only)."

      - name: Ensure iOS Simulator exists
        run: bash Scripts/ensure-simulator.sh

      - name: Run tests (gating)
        run: |
          set -euo pipefail
          xcodebuild test -scheme Vanta \
            -destination "$SIM_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES 2>&1 | tee build-test.log

      - name: Detect signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] \
             && [ -n "$APPLE_PROVISIONING_PROFILE" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "Signed Release mode: Apple signing identity available."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "Unsigned / Build-only mode: no signing secrets configured."
          fi

      # ---------------- UNSIGNED archive + packaging ----------------
      - name: Archive (unsigned)
        if: steps.signing.outputs.mode == 'unsigned'
        run: |
          set -euo pipefail
          xcodebuild archive -scheme Vanta -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VANTA.xcarchive \
            "MARKETING_VERSION=${{ steps.version.outputs.version }}" \
            "CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}" \
            "PRODUCT_BUNDLE_IDENTIFIER=${{ env.APP_BUNDLE_ID }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" 2>&1 | tee build-archive.log
          test -d build/VANTA.xcarchive || { echo "::error::Archive was not created."; exit 1; }

      - name: Package unsigned IPA (Payload zip, no fake signing)
        if: steps.signing.outputs.mode == 'unsigned'
        run: |
          set -euo pipefail
          APPS=(build/VANTA.xcarchive/Products/Applications/*.app)
          [ ${#APPS[@]} -eq 1 ] || { echo "::error::Expected exactly one .app, found ${#APPS[@]}."; exit 1; }
          rm -rf build/Payload VANTA.ipa
          mkdir -p build/Payload
          cp -R "${APPS[0]}" build/Payload/
          ditto -c -k --keepParent build/Payload VANTA.ipa
          echo "Unsigned IPA packaged (NOT signed, NOT installable as-is)."

      # ---------------- SIGNED archive + export ----------------
      - name: Import signing identity (signed mode only)
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          echo "VANTA_TMPDIR=$WORK" >> "$GITHUB_ENV"
          KC="$WORK/vanta-signing.keychain-db"
          KP="$(openssl rand -base64 32)"
          echo "VANTA_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "VANTA_KEYCHAIN_PASSWORD=$KP" >> "$GITHUB_ENV"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$WORK/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$WORK/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$WORK/cert.p12"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/vanta-release.mobileprovision
          echo "Signing identity imported into throwaway keychain."

      - name: Archive (signed)
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$VANTA_KEYCHAIN_PASSWORD" "$VANTA_KEYCHAIN"
          xcodebuild archive -scheme Vanta -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VANTA.xcarchive \
            "MARKETING_VERSION=${{ steps.version.outputs.version }}" \
            "CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}" \
            "PRODUCT_BUNDLE_IDENTIFIER=${{ env.APP_BUNDLE_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" 2>&1 | tee build-archive.log
          test -d build/VANTA.xcarchive || { echo "::error::Archive was not created."; exit 1; }

      - name: Export signed IPA (ExportOptions generated, never hardcoded)
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          set -euo pipefail
          METHOD="${EXPORT_METHOD:-development}"
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          rm -rf build/export VANTA.ipa
          xcodebuild -exportArchive \
            -archivePath build/VANTA.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export 2>&1 | tee build-export.log
          IPAS=(build/export/*.ipa)
          [ ${#IPAS[@]} -eq 1 ] || { echo "::error::Expected exactly one exported IPA, found ${#IPAS[@]}."; exit 1; }
          mv "${IPAS[0]}" VANTA.ipa

      # ---------------- Validation, checksums, notes ----------------
      - name: Validate IPA (gating — fails the workflow on any mismatch)
        run: |
          set -euo pipefail
          bash Scripts/validate-ipa.sh VANTA.ipa \
            --mode "${{ steps.signing.outputs.mode }}" \
            --expected-version "${{ steps.version.outputs.version }}"

      - name: Compute SHA256SUMS.txt from the real IPA
        run: |
          set -euo pipefail
          shasum -a 256 VANTA.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          set -euo pipefail
          python3 Scripts/generate-release-notes.py \
            --tag "${{ steps.version.outputs.tag }}" \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build }}" \
            --signing-mode "${{ steps.signing.outputs.mode }}" \
            --sha-file SHA256SUMS.txt \
            --bundle-id "${{ env.APP_BUNDLE_ID }}"
          cat RELEASE_NOTES.md

      - name: Generate SBOM (CycloneDX, zero vendored deps by design)
        run: |
          set -euo pipefail
          python3 Scripts/generate-sbom.py \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build }}" \
            --bundle-id "${{ env.APP_BUNDLE_ID }}" \
            --sha-file SHA256SUMS.txt \
            --output SBOM.json
          cat SBOM.json

      - name: Upload artifacts (VANTA-iOS)
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-iOS
          path: |
            VANTA.ipa
            SHA256SUMS.txt
            SBOM.json
            RELEASE_NOTES.md
            build-archive.log
            build-test.log
          if-no-files-found: error

      - name: Publish GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          test -f VANTA.ipa || { echo "::error::VANTA.ipa missing — refusing to publish."; exit 1; }
          test -f SHA256SUMS.txt || { echo "::error::SHA256SUMS.txt missing — refusing to publish."; exit 1; }
          test -f SBOM.json || { echo "::error::SBOM.json missing — refusing to publish."; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets."
            gh release upload "$TAG" VANTA.ipa SHA256SUMS.txt SBOM.json --clobber
          else
            gh release create "$TAG" \
              --title "VANTA ${{ steps.version.outputs.version }}" \
              --notes-file RELEASE_NOTES.md \
              VANTA.ipa SHA256SUMS.txt SBOM.json
          fi

      - name: Cleanup signing material (always)
        if: always()
        run: |
          if [ -n "${VANTA_KEYCHAIN:-}" ]; then
            security delete-keychain "$VANTA_KEYCHAIN" || true
          fi
          if [ -n "${VANTA_TMPDIR:-}" ]; then
            rm -rf "$VANTA_TMPDIR" || true
          fi
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/vanta-release.mobileprovision || true
