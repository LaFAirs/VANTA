name: CodeQL

# Static analysis for Swift. The project is XcodeGen-based, so the Xcode
# project is generated before CodeQL initialises (autobuild would fail
# without it). Simulator build, no signing required.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
      - name: Build for analysis
        run: |
          xcodebuild -scheme Vanta \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
