name: Emulator IPA jetzt bauen

# Manueller SwitchEmu-IPA-Build ohne Version-Tag:
# Actions -> "Emulator IPA jetzt bauen" -> Run workflow.
# Baut auf dem macOS-Runner (Xcode) das Emulator-Projekt (Emulator/project-emu.yml)
# als echtes, aber UNSIGNIERTES IPA (CODE_SIGNING_ALLOWED=NO, Payload/*.app per
# ditto gezippt) und laedt es als Artifact "SwitchEmu-ipa-now" hoch.
#
# Ehrlicher Stand: lauffaehige App + echte generische Komponenten (Memory mit
# Guards, Demo-ISA-Interpreter, Scheduler, Interrupts, RingBuffer, Metal-
# Renderer-Skelett, Saves, Logs, Tests). KEINE Switch-CPU/GPU-Emulation,
# KEIN Laden kommerzieller Formate, KEINE Keys/Firmware/Entschluesselung.
# Details: Emulator/Documentation/ARCHITECTURE-EMULATOR.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MARKETING_VERSION (x.y.z)"
        required: false
        default: "0.1.0"

permissions:
  contents: read
  actions: write

jobs:
  build-emu-ipa:
    name: SwitchEmu IPA bauen (unsigniert, manuell)
    runs-on: macos-15
    env:
      APP_BUNDLE_ID: com.vanta.switchemu
    defaults:
      run:
        working-directory: Emulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version pruefen
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' ist nicht MAJOR.MINOR.PATCH (z. B. 0.1.0)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen || brew upgrade xcodegen

      - name: Generate Xcode project (Emulator spec)
        run: |
          set -euo pipefail
          xcodegen generate --spec project-emu.yml
          test -d SwitchEmu.xcodeproj || { echo "::error::xcodegen did not produce SwitchEmu.xcodeproj"; exit 1; }

      - name: Stamp version into Info.plist (input is source of truth)
        run: |
          set -euo pipefail
          PLIST="App/Info.plist"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          set_or_add() {
            /usr/libexec/PlistBuddy -c "Set :$1 $3" "$4" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$4"
          }
          set_or_add CFBundleShortVersionString string "$VERSION" "$PLIST"
          set_or_add CFBundleVersion string "$BUILD" "$PLIST"
          set_or_add CFBundleIdentifier string "${{ env.APP_BUNDLE_ID }}" "$PLIST"

      - name: Ensure iOS Simulator exists
        run: bash ../Scripts/ensure-simulator.sh

      - name: Run unit tests (gating)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          xcodebuild test -scheme SwitchEmu \
            -destination "$SIM_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-test.log

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive -scheme SwitchEmu -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SwitchEmu.xcarchive \
            "MARKETING_VERSION=${{ steps.version.outputs.version }}" \
            "CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}" \
            "PRODUCT_BUNDLE_IDENTIFIER=${{ env.APP_BUNDLE_ID }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" 2>&1 | tee build-archive.log
          test -d build/SwitchEmu.xcarchive || { echo "::error::Archive was not created."; exit 1; }

      - name: Package unsigned IPA (Payload zip, no fake signing)
        run: |
          set -euo pipefail
          APPS=(build/SwitchEmu.xcarchive/Products/Applications/*.app)
          [ ${#APPS[@]} -eq 1 ] || { echo "::error::Expected exactly one .app, found ${#APPS[@]}."; exit 1; }
          rm -rf build/Payload SwitchEmu.ipa
          mkdir -p build/Payload
          cp -R "${APPS[0]}" build/Payload/
          ditto -c -k --keepParent build/Payload SwitchEmu.ipa
          echo "Unsigned IPA packaged (NOT signed, NOT installable as-is)."

      - name: Validate IPA (gating)
        run: |
          set -euo pipefail
          bash ../Scripts/validate-ipa.sh SwitchEmu.ipa \
            --mode unsigned \
            --expected-version "${{ steps.version.outputs.version }}"

      - name: Compute SHA256SUMS.txt from the real IPA
        run: |
          set -euo pipefail
          shasum -a 256 SwitchEmu.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload IPA artifact (SwitchEmu-ipa-now)
        uses: actions/upload-artifact@v4
        with:
          name: SwitchEmu-ipa-now
          path: |
            Emulator/SwitchEmu.ipa
            Emulator/SHA256SUMS.txt
            Emulator/build-archive.log
            Emulator/build-test.log
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## SwitchEmu.ipa gebaut (unsigniert)

          - Artifact: **SwitchEmu-ipa-now** (SwitchEmu.ipa + SHA256SUMS.txt + Logs)
          - Version: ${{ steps.version.outputs.version }} (Build ${{ steps.version.outputs.build }})
          - Modus: **unsigned** — vor der Installation mit eigener Apple-Identitaet re-signieren.
          - Stand: Demo-/Geruest-Build, keine Switch-Spiele lauffaehig (siehe ARCHITECTURE-EMULATOR.md).
          - Pruefsumme lokal verifizieren: \`shasum -a 256 -c SHA256SUMS.txt\`
          EOF
