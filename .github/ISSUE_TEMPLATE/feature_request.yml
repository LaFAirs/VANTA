name: Feature request
description: Propose a VANTA feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: "Problem", description: "What sideloading workflow is painful today?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: "Proposal", description: "Original design only — no clones of proprietary apps." }
    validations: { required: true }
  - type: checkboxes
    id: honesty
    attributes:
      label: Honesty check
      options:
        - label: "This feature can be implemented without faking signing/validation/installation"
          required: true
